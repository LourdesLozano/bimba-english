<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7d9e4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <title>Bimba English</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand"><span class="dog-mark" aria-hidden="true">🐼</span><span>Bimba <b>English</b></span></div>
        <nav id="main-nav" aria-label="Navegación principal">
          <button class="nav-item active" data-view="home"><span>⌂</span> Inicio</button>
          <button class="nav-item" data-view="learn"><span>✦</span> Aprender</button>
          <button class="nav-item" data-view="library"><span>☷</span> Lecciones sueltas</button>
          <button class="nav-item" data-view="series"><span>▶</span> Series</button>
          <button class="nav-item" data-view="vocabulary"><span>♡</span> Mi vocabulario</button>
          <button class="nav-item" data-view="vocabularyTopics"><span>♧</span> Vocabulario por temas</button>
          <button class="nav-item" data-view="practice"><span>✎</span> Practicar palabras</button>
          <button class="nav-item" data-view="speaking"><span>🎙</span> Hablar y pronunciar</button>
          <button class="nav-item" data-view="progress"><span>◔</span> Progreso</button>
          <button class="nav-item" data-view="week"><span>▦</span> Semana</button>
        </nav>
        <div class="sidebar-footer">
          <div class="mini-dog">🐼</div>
          <small>Tu constancia es tu superpoder.</small>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="top-leading">
            <button class="icon-button back-button" id="back-button" aria-label="Volver atrás" title="Volver atrás">←</button>
            <button class="icon-button menu-button" id="menu-button" aria-label="Abrir menú" title="Abrir menú">☰</button>
            <div class="mobile-brand"><span class="dog-mark">🐼</span> Bimba</div>
          </div>
          <div class="top-actions">
            <span class="sync-status" id="sync-status">● Guardado en este dispositivo</span>
            <button class="theme-button" id="theme-button" aria-label="Cambiar color" title="Cambiar color">●</button>
            <button class="icon-button sync-button" id="auth-button" aria-label="Sincronizar progreso" title="Sincronizar progreso">↻</button>
            <button class="icon-button" id="profile-button" aria-label="Abrir perfil">👤</button>
          </div>
        </header>
        <div id="app-content"></div>
      </main>
    </div>
    <div class="menu-scrim" id="menu-scrim" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
